  h+=grp('Охотятся раньше (порог выше 50%)','Могут напасть, когда у команды ещё хороший рассудок.',[['Yokai','80% — если рядом говорят вслух'],['Thaye','75% в начале игры, потом падает'],['Demon','70% (и может охотиться при любом рассудке)'],['Kormos','70% — если рядом кто-то бежит'],['Dayan','до 65% — зависит от движения игроков'],['Obambo','65% — в агрессивной фазе'],['Raiju','65% — рядом включена электроника'],['Mare','60% — в тёмной комнате'],['Onryo','60%'],['Gallu','60% — в яростном состоянии']]);

 if(rf==4){

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k,id=b.dataset.id;
 const rm=(arr,x)=>{const i=arr.indexOf(x);if(i>=0)arr.splice(i,1)};
 if(a=='e'){if(S.F.includes(k)){rm(S.F,k);S.R.push(k)}else if(S.R.includes(k))rm(S.R,k);else S.F.push(k)}

 else if(a=='lim')S.lim=+b.dataset.n;

 else if(a=='m'){e.stopPropagation();S.man.includes(id)?rm(S.man,id):S.man.push(id)}
 else if(a=='x')cur=id;

 else if(a=='reset'){if(!rst){rst=1;setTimeout(()=>{rst=0;render()},3000)}else{S={F:[],R:[],lim:S.lim,c:{},man:[],hide:S.hide,tab:1,sp:{},lo:0,hs:0};rst=0;cur=null}}
