<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Phasmo Помощник</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&display=swap">
<style>
:root{--bg:#f1f2f6;--cd:#fff;--tx:#16171c;--mu:#6a6e7b;--bd:#dcdee5;--ok:#13a05a;--no:#d83a3a;--ac:#6a4bd6;--wn:#c98a00;--c1:#13a05a;--c2:#ec7b1c;--c3:#2f7de1;--c4:#6a4bd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0d11;--cd:#171921;--tx:#eceef3;--mu:#8f94a3;--bd:#272a35;--ok:#2fd27f;--no:#ff5c5c;--ac:#9a82ff;--wn:#f0b429;--c1:#2fd27f;--c2:#ff9a44;--c3:#5b9bff;--c4:#a18bff}}
:root[data-theme="dark"]{--bg:#0c0d11;--cd:#171921;--tx:#eceef3;--mu:#8f94a3;--bd:#272a35;--ok:#2fd27f;--no:#ff5c5c;--ac:#9a82ff;--wn:#f0b429;--c1:#2fd27f;--c2:#ff9a44;--c3:#5b9bff;--c4:#a18bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer}
.w{max-width:820px;margin:0 auto;padding:0 10px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;gap:6px}.top h1{font-size:16px;margin:0;flex:1}
.pill{background:var(--ac);color:#fff;border-radius:99px;padding:3px 11px;font-weight:800;font-size:14px;border:0}
.sm{background:var(--cd);border:1px solid var(--bd);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600}
.sm.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.st{background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:14px;padding:12px;margin:12px 0}
.sh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.sh .n{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.sh b{font-size:16px}.sh small{display:block;color:var(--mu);font-size:12px;font-weight:400}
.v{border-radius:14px;padding:11px 12px;margin:12px 0;border:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 9%,var(--cd))}
.v.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--cd))}.v.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 10%,var(--cd))}
.v .big{font-size:20px;font-weight:800}
.nm{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;margin:3px 3px 0 0;font-size:13px;font-weight:600;cursor:pointer}
.nm.out{opacity:.35;text-decoration:line-through}.nm.dm{border-style:dashed;opacity:.6}
.ex{margin:4px 0 8px;font-size:14px}.mu{color:var(--mu);font-size:13px}
.bt{border:1px solid var(--bd);background:var(--bg);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700}
.bt.y{background:var(--ok);border-color:var(--ok);color:#fff}.bt.n{background:var(--no);border-color:var(--no);color:#fff}
.sg{display:flex;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}.sg:first-of-type{border-top:0}
.sg>div{flex:1;min-width:0}.sg small{display:block;color:var(--mu);font-size:12px}
/* evidence */
.md{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.md button{background:var(--bg);border:2px solid var(--bd);border-radius:11px;padding:8px 2px;display:flex;flex-direction:column;align-items:center}.md b{font-size:22px}.md small{font-size:11px;color:var(--mu)}.md button.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--cd))}
.mn{margin-top:8px;font-size:13px;color:var(--mu)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:7px}
.eb{position:relative;background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px}
.eb i{font-style:normal;font-size:28px;line-height:1.1}.eb b{font-size:11px;font-weight:700}.eb em{font-style:normal;font-size:10px;color:var(--mu)}
.eb u{position:absolute;top:1px;right:6px;text-decoration:none;font-size:15px;font-weight:900}
.eb.f{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--cd))}.eb.f u{color:var(--ok)}
.eb.r{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--cd));opacity:.75}.eb.r u{color:var(--no)}.eb.r b{text-decoration:line-through}
.stl{margin-top:9px;padding:6px 10px;border-radius:9px;background:var(--bg);border:1px solid var(--bd);font-size:13px;font-weight:600}.stl.ok{border-color:var(--ok);color:var(--ok)}.stl.v{border-color:var(--ac);color:var(--ac)}.stl.bad{border-color:var(--no);color:var(--no)}
/* speed */
.hg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hb{background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.hb i{font-style:normal;font-size:28px}.hb b{font-size:13px}.hb small{color:var(--mu);font-size:11px}.hb em{font-style:normal;font-size:11px;color:var(--c2);font-weight:700}
.hb.y{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--cd))}.hb.n{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--cd))}
@media(max-width:480px){.hb small{display:none}.hb i{font-size:24px}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.seg button{flex:1;min-width:52px}.seg button.on{background:var(--c2);border-color:var(--c2);color:#fff}
.sp{display:flex;flex-direction:column;gap:1px;padding:8px 0;border-top:1px solid var(--bd);font-size:13px;cursor:pointer}.sp:first-of-type{border-top:0}.sp span{color:var(--mu)}
details>summary{cursor:pointer;font-weight:700;padding:6px 0}
details.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:6px 12px;margin:10px 0}
/* tests */
.tt{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tt .sm{white-space:nowrap}
.tc{border:2px solid var(--bd);border-radius:13px;padding:10px;margin-bottom:9px;background:var(--cd)}.tc.set{border-color:var(--ok)}
.tc b{font-size:15px}.tc small{display:block;color:var(--mu);font-size:12px;margin:2px 0 7px}
.tc .tg{font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--bg);color:var(--mu);vertical-align:middle}
.op{display:flex;flex-direction:column;gap:5px}.op button{text-align:left;background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.op button em{display:block;font-style:normal;font-weight:400;color:var(--c3);font-size:11px}.op button.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--cd))}
/* journal */
.page{background:radial-gradient(ellipse at center,#efe7d2 0%,#e2d6b8 70%,#d6c79f 100%);color:#17140e;border-radius:12px;padding:16px 6px 14px;box-shadow:inset 0 0 50px rgba(110,80,20,.4),0 2px 10px rgba(0,0,0,.25);font-family:'Neucha','Segoe Print','Comic Sans MS',cursive}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 0}
.gn{position:relative;text-align:center;padding:11px 1px;cursor:pointer;font-size:clamp(15px,4.8vw,26px);line-height:1.15;word-break:break-word}
.gn span{display:inline-block;padding:1px 6px}.gn small{display:block;font-size:11px;color:#6b5a38;font-family:system-ui,sans-serif}
.gn.out span{text-decoration:line-through;text-decoration-thickness:3px;opacity:.5}
.gn.cir span{border:3px solid #17140e;border-radius:50%/65%;padding:1px 12px;background:rgba(95,170,225,.6)}
.pgx{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:12px 4px 0;font:12px system-ui,sans-serif;color:#5a4a2a;flex-wrap:wrap}
/* sheet */
#sh{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}#sh[hidden]{display:none}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.pn{position:relative;background:var(--cd);width:100%;max-width:680px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));border-top:5px solid var(--c)}
.pn h2{margin:0;font-size:24px}.pn h2 small{font-size:13px;color:var(--mu);font-weight:400;margin-left:6px}.hd{display:flex;gap:8px;align-items:center}
.stp{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;color:#fff}.stp.ok{background:var(--ok)}.stp.bad{background:var(--no)}
.pn section{margin-top:13px}.pn h4{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.pn ul{margin:0;padding-left:18px}.pn li{margin-bottom:3px;font-size:14px}.pn li.r{color:var(--no)}.pn li.g::marker{color:var(--ok)}.pn li.x::marker{color:var(--no)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{border:2px solid var(--bd);border-radius:10px;padding:5px 9px;font-size:13px;font-weight:600}
.chips span.f,.chips span.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--cd))}.chips span.r{border-color:var(--no);opacity:.6;text-decoration:line-through}.chips span.off{opacity:.35;text-decoration:line-through}.chips span.fk{border-style:dashed}
.bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.bar .bt{flex:1;padding:11px;min-width:120px}
.mx{border:1px solid var(--bd);background:var(--bg);border-radius:9px;width:34px;height:34px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}
nav button{flex:1;border:0;background:transparent;border-radius:11px;padding:7px 2px;font-size:12px;font-weight:700;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button i{font-style:normal;font-size:20px}nav button.on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.ft{color:var(--mu);font-size:12px;margin:14px 0}
</style>
</head>
<body>
<div class="w">
<header><div class="top"><h1>👻 Phasmo Помощник</h1><button class="pill" id="cnt" data-a="tab" data-t="gh"></button><button class="sm" data-a="reset" id="rb">↺ Новый</button></div></header>
<div id="app"></div>
<p class="ft">Данные: phasmophobia.su (редакция июля 2026) и GameSpot. Порядок и названия призраков — как в журнале игры. Состояние хранится на этом устройстве.</p>
</div>
<div id="sh" hidden><div class="bk" data-a="cl"></div><div class="pn" id="pn"></div></div>

const EVX={E:'Считыватель ЭМП: уликой считается только уровень 5 (горят все 5 лампочек). Уровни 2–4 уликой не считаются.',B:'Задай вопрос в любимой комнате, в темноте. Любой ответ радио = улика.',U:'УФ-фонарик: светящиеся отпечатки рук на дверях, окнах, выключателях после взаимодействия призрака.',O:'Камера в ночном режиме в любимой комнате при выключенном свете: плавают светящиеся шарики.',W:'Положи блокнот в любимой комнате (или рядом). Любая запись или рисунок = улика.',F:'Термометр в любимой комнате при включённом щитке: температура ниже 0 °C. Пар изо рта улику не подтверждает.',D:'Лазерный проектор в любимой комнате: смотри силуэт или движение через камеру или глазами.'};
// id, рус, англ, улики, гарант., классы скорости (n обычная, s медленная, f быстрая), ускоряется от LoS, скорость, порог, макс.порог, признаки, подтверждает, исключает, особенность, слабость
const G=[
['as','Асванг','Aswang','FWD','','sn',1,'База 1.53 м/с (чуть медленнее обычного). От зрительного контакта разгоняется быстрее остальных: максимум 2.52 м/с за 8.66 с вместо 13 с.','50%',50,['Нашёл игрока в укрытии — завершает охоту досрочно, а не убивает','Следующую охоту идёт к месту, где стоял запомненный игрок, даже в безопасный период'],['Достиг максимума скорости от LoS за 8.66 с (не за 13)','Нашёл игрока в официальном укрытии и завершил охоту, не убив'],['Достигает максимума скорости от LoS не раньше чем за 13 с','Убил игрока в официальном укрытии'],'Заметив цель, начинает преследовать быстрее.','Предпочитает преследовать, а не искать.'],
['ba','Банши','Banshee','UOD','','n',1,'1.7 м/с, разгон от LoS до 2.8 м/с.','50% — считается по рассудку ОДНОЙ цели, а не по среднему команды',999,['Только женская модель','Выбирает одну цель; на охоте игнорирует остальных, пока цель в доме','Часто «Поющий призрак»: касание при пении −15% вместо −10%','Часто далеко от любимой комнаты — идёт к цели'],['Женский крик в направленный микрофон или рекордер','На охоте игнорирует всех, кроме одного, пока цель в доме'],['Призрак — мужчина','Преследует нескольких игроков при цели в доме'],'Ослабляет жертву перед атакой.','Крик ловится направленным микрофоном.'],
['da','Дайан','Dayan','EBO','','snf',1,'Если в 10 м есть игрок: он стоит → 1.2 м/с; жмёт клавиши движения → 2.25 м/с (фикс., перекрывает LoS). Никого в 10 м → 1.7 м/с + LoS.','45% если ближний игрок стоит · 50% · 65% если двигается',65,['Только женская модель','Скорость и порог зависят от того, двигается ли ближайший игрок в 10 м'],['Стоящий в 10 м игрок → призрак медленный; начал идти → сразу быстрый'],['Призрак — мужчина','Не замедляется, когда ближайший игрок стоит'],'Получает силу, если рядом «танцуют».','Теряет силу, если рядом стоят неподвижно. Сядь за угол вне LoS и не шевелись.'],
['dd','Дейльдегаст','Deildegast','EWD','','snf',0,'Фиксированная, без разгона от LoS: 3.0 м/с минус 0.1 за каждый уникальный предмет карты, взятый в руки/использованный вне охоты (мёртвые тоже). 13 предметов → 1.7; минимум 0.4 (26 предметов). После охоты сброс.','50%',50,['В начале контракта очень быстрый (~3 м/с) и не разгоняется от LoS','Реже обычного трогает двери и свет (10% вместо 25%)'],['Фиксированные ~3 м/с без LoS-разгона, пока предметы не трогали','После множества взятых предметов на следующей охоте заметно медленнее'],['Ускоряется от зрительного контакта','Скорость не зависит от предметов карты'],'Сильнее в начале расследования.','Замедляется, когда живые и мёртвые трогают предметы карты (тарелки, свет, краны, щиток).'],
['de','Демон','Demon','UWF','','n',1,'1.7 м/с + разгон от LoS.','70% · способность может начать охоту на любом рассудке',999,['Кулдаун между охотами 20 с вместо 25 с','Благовония блокируют охоту лишь 60 с (обычно 90, у Духа 180)','Распятие бьёт на 50% дальше: 4.5 / 6 / 7.5 м'],['Охота раньше 60 с после действующего благовония','Охота или укус распятия раньше 25 с после предыдущей','Распятие сработало дальше обычного радиуса'],['Охота началась близко к распятию — в радиусе, на 50% превышающем обычный'],'Охотится чаще всех.','Боится распятия.'],
['dg','Деоген','Deogen','BWD','B','snf',0,'Только от дистанции до цели: ≥6 м — 3.0 м/с; 6–2.5 м — плавно замедляется; <2.5 м — 0.4 м/с. Без LoS.','40%',40,['Всегда знает, где игроки: прятаться бесполезно, нужно водить','Издалека несётся, вблизи почти ползёт','Мерцание чуть дольше видно (похоже на Они)'],['Быстро настигает, но если игрок движется — не догоняет','Радио в упор отвечает тяжёлым дыханием (33%)'],['Не может найти игрока во время охоты'],'Чует живых.','Рядом с жертвой почти стоит.'],

 const sg=sugSp(rem);
 if(sg.length)h+=`<div class="st" style="--c:var(--c2)">${stp('➡','var(--c2)','Что проверить дальше','самые полезные наблюдения')}`+sg.map(s=>{
  if(s.t=='sp'){const c=CL.find(x=>x[0]==s.k);return `<div class="sg"><div><b>${c[1]} ${c[2]} скорость</b><small>возможна у ${s.h} из ${n}. Видел такую — отметь</small></div><button class="bt y" data-a="sp" data-k="${s.k}">✓ видел</button></div>`}
  if(s.t=='lo')return `<div class="sg"><div><b>⏩ Ускорялся, пока видел тебя?</b><small>ускоряются ${s.h} из ${n}</small></div><button class="bt y" data-a="slo" data-v="1">✓ да</button><button class="bt n" data-a="slo" data-v="-1">✕ нет</button></div>`;
  return `<div class="sg"><div><b>Охота при рассудке выше ${s.k}%?</b><small>могут начать так ${s.h} из ${n}</small></div><button class="bt y" data-a="hs" data-v="${s.k}">✓ да</button></div>`}).join('')+'</div>';
 h+=`<details class="card" open><summary>🏃 Категории скорости: кто что может показать</summary>`+CL.map(c=>`<div style="margin:10px 0"><b>${c[1]} ${c[2]} (${c[3]})</b><br>${G.filter(g=>g.cl.includes(c[0])).map(g=>chip(g,rem)).join('')}</div>`).join('')+`<p class="mu">Призраки с переменной скоростью попадают в несколько категорий.</p></details>`;
 h+=`<details class="card"><summary>⏱ Особые скорости простыми словами</summary>${G.filter(g=>g.cl!='n').map(g=>`<div class="sp" data-a="x" data-id="${g.id}"><b>${g.ru}</b><span>${g.spd}</span></div>`).join('')}</details>`;
 h+=`<details class="card"><summary>🧠 Что такое порог охоты</summary><p class="ex">У каждого призрака есть число — <b>порог рассудка</b>. Призрак может начать охоту, только когда <b>средний рассудок живых игроков ниже этого числа</b>. У большинства порог 50%: пока у команды выше 50% — охоты нет (кроме проклятых предметов).</p><p class="ex"><b>Охотятся раньше (порог выше 50%):</b> ${G.filter(g=>g.maxT>50).map(g=>`${g.ru} (${g.thr})`).join('; ')}.</p><p class="ex"><b>Охотятся позже (порог ниже 50%):</b> ${G.filter(g=>/^(35|40|10|74|45)/.test(g.thr)||g.maxT<50).map(g=>`${g.ru} (${g.thr})`).join('; ')}.</p><p class="ex"><b>Все остальные</b> — 50%. Банши считает рассудок одной цели, а не команды.</p></details>`;
 return h}
// ---- вкладка ТЕСТЫ ----
function vTs(c){const {rem}=c,n=rem.length;
 const tabs=[['use','Полезные'],['safe','Без охоты'],['hunt','На охоте'],['set','Отмечено'],['all','Все']];
 let list=T.filter(t=>ft=='all'||(ft=='use'&&S.t[t.id]==null&&tsplit(t,rem)>0)||(ft=='safe'&&t.g=='safe')||(ft=='hunt'&&t.g=='hunt')||(ft=='set'&&S.t[t.id]!=null));
 if(ft=='use')list.sort((a,b)=>(tsplit(b,rem)+b.f*3)-(tsplit(a,rem)+a.f*3));
 let h=strip(rem)+`<div class="tt">${tabs.map(t=>`<button class="sm ${ft==t[0]?'on':''}" data-a="ft" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`;
 h+=list.length?list.map(t=>{const sel=S.t[t.id];return `<div class="tc ${sel!=null?'set':''}"><b>${t.l}</b>${t.f?'<span class="tg">⚡ быстро</span>':''}${t.g=='hunt'?'<span class="tg">⚠ на охоте</span>':''}<small>${t.h}</small><div class="op">${t.o.map((o,i)=>{const m=rem.filter(g=>ok(o[1],g.id));return `<button class="${sel==i?'on':''}" data-a="t" data-id="${t.id}" data-i="${i}">${sel==i?'✓ ':''}${o[0]}<em>${sel==i?'нажми, чтобы снять':'если так → останется '+(m.length&&m.length<=3?m.map(g=>g.ru).join(', '):m.length)}</em></button>`}).join('')}</div></div>`}).join(''):`<p class="mu">${ft=='use'?'Сейчас ни один тест не разделяет оставшихся — добавь улики или скорость.':'Здесь пока пусто.'}</p>`;
 return h}
// ---- вкладка ПРИЗРАКИ ----
function vGh(c){const {rem,rows}=c;
 return strip(rem)+`<div class="page"><div class="gg">${G.map(g=>{const out=rows.find(r=>r.g==g).w.length>0,ci=S.cir.includes(g.id);return `<div class="gn ${out?'out':''} ${ci?'cir':''}" data-a="x" data-id="${g.id}"><span>${g.ru}</span>${S.en?`<small>${g.en}</small>`:''}</div>`}).join('')}</div><div class="pgx"><span>зачёркнуто — вычеркнуто по твоим отметкам · обведено — подозреваешь</span><button class="sm" data-a="en">${S.en?'Скрыть':'Показать'} англ. названия</button></div></div><p class="mu" style="margin:8px 2px">Тап по призраку открывает карточку: признаки, тесты, скорость, порог и причины вычёркивания.</p>`}
// ---- карточка призрака ----
function sheet(){const el=$('#sh');if(!cur){el.hidden=true;document.body.style.overflow='';return}
 const g=gid(cur),w=why(g),out=w.length,mi=g.id=='mi',L=S.lim,fr=mi?S.F.filter(k=>k!='O'):S.F,slots=L-fr.length,left=[...(mi?'BUF':g.ev)].filter(k=>!S.F.includes(k)&&!S.R.includes(k)),man=S.man.includes(g.id),ci=S.cir.includes(g.id);
 const need=L==0?'Улики не выпадают — определяй по охоте и тестам.':slots<=0?`✓ Лимит улик закрыт (${fr.length}/${L}).`:`Может показать ещё ${slots}: ${left.map(k=>EV[k][0]+' '+EV[k][1]).join(', ')}.`;
 $('#pn').style.setProperty('--c',out?'var(--no)':'var(--ok)');
 const ul=(a,cls)=>a.length?`<ul>${a.map(x=>`<li class="${cls}">${x}</li>`).join('')}</ul>`:'<p class="mu">—</p>';
 $('#pn').innerHTML=`<div class="hd"><h2>${g.ru}<small>${g.en}</small></h2><span class="stp ${out?'bad':'ok'}">${out?'✕ вычеркнут':'✓ подходит'}</span><button class="mx" data-a="cl" style="margin-left:auto">✕</button></div>
 ${out?`<section><h4>Почему вычеркнут</h4>${ul(w,'r')}</section>`:`<section><p class="ex" style="margin:0"><b>${need}</b></p></section>`}
 <section><h4>Улики</h4><div class="chips">${[...g.ev].map(k=>`<span class="${S.F.includes(k)?'f':S.R.includes(k)?'r':''}">${EV[k][0]} ${EV[k][1]}${g.gu==k?' 🔒':''}</span>`).join('')}${mi?'<span class="fk">🔮 всегда, но не улика</span>':''}</div>${g.gu?`<p class="mu" style="margin:6px 0 0">🔒 При режимах 1–2 эта улика у него гарантирована.</p>`:''}</section>
 <section><h4>Признаки</h4>${ul(g.sign,'')}</section>
 <section><h4>✓ Подтверждает</h4>${ul(g.yes,'g')}</section>
 <section><h4>✕ Исключает</h4>${ul(g.no,'x')}</section>
 <section><h4>Скорость на охоте</h4><div class="chips">${CL.map(c=>`<span class="${g.cl.includes(c[0])?'on':'off'}">${c[1]} ${c[2]}</span>`).join('')}<span class="${g.los?'on':'off'}">⏩ ${g.los?'ускоряется от LoS':'не ускоряется'}</span></div><p class="ex">${g.spd}</p></section>
 <section><h4>Порог охоты (рассудок команды)</h4><p class="ex">${g.thr}${g.maxT==50&&g.thr=='50%'?' — обычный: охотится, когда средний рассудок ниже 50%.':''}</p></section>
 <section><h4>Из журнала</h4><p class="ex"><b>Особенность:</b> ${g.trait}<br><b>Слабость:</b> ${g.weak}</p></section>
 <div class="bar"><button class="bt ${man?'':'n'}" data-a="m" data-id="${g.id}">${man?'↺ Вернуть':'✕ Вычеркнуть вручную'}</button><button class="bt ${ci?'y':''}" data-a="c" data-id="${g.id}">${ci?'● Обведён':'○ Обвести (подозреваю)'}</button><button class="bt" data-a="cl">Закрыть</button></div>`;
 el.hidden=false;document.body.style.overflow='hidden';$('#pn').scrollTop=0}
// ---- рендер ----
function render(){const c=ctx(),rem=c.rem;
 $('#cnt').textContent=rem.length+' / 30';$('#rb').textContent=rst?'Точно?':'↺ Новый';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
 $('#app').innerHTML={ev:vEv,sp:vSp,ts:vTs,gh:vGh}[S.tab](c);
 sheet()}
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&cur){cur=null;render()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k,id=b.dataset.id,ov=b.dataset.v;
 const rm=(arr,x)=>{const i=arr.indexOf(x);if(i>=0)arr.splice(i,1)},tg=(arr,x)=>arr.includes(x)?rm(arr,x):arr.push(x);
 let keep=false;
 if(a=='e'){if(S.F.includes(k)){rm(S.F,k);S.R.push(k)}else if(S.R.includes(k))rm(S.R,k);else S.F.push(k)}
 else if(a=='sf'){rm(S.R,k);if(!S.F.includes(k))S.F.push(k)}
 else if(a=='sr'){rm(S.F,k);if(!S.R.includes(k))S.R.push(k)}
 else if(a=='lim')S.lim=+b.dataset.n;
 else if(a=='sp')S.sp[k]=!S.sp[k];
 else if(a=='lo')S.lo=S.lo==0?1:S.lo==1?-1:0;
 else if(a=='slo')S.lo=+ov;
 else if(a=='hs')S.hs=+ov;
 else if(a=='t'){const i=+b.dataset.i;if(S.t[id]==i)delete S.t[id];else S.t[id]=i}
 else if(a=='ft')ft=ov;
 else if(a=='m')tg(S.man,id);
 else if(a=='c')tg(S.cir,id);
 else if(a=='x')cur=id;
 else if(a=='cl')cur=null;
 else if(a=='en')S.en=!S.en;
 else if(a=='tab'){S.tab=b.dataset.t;cur=null;scrollTo(0,0)}
 else if(a=='reset'){if(!rst){rst=1;setTimeout(()=>{rst=0;render()},3000)}else{S={F:[],R:[],lim:S.lim,sp:{},lo:0,hs:0,t:{},man:[],cir:[],tab:S.tab,en:S.en};rst=0;cur=null}}
 save();render()});
render();
</script>
</body>
</html>
