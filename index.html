.cf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd);font-size:14px}.cf .sm{min-width:86px}.cf .sm.on{background:var(--ok);border-color:var(--ok)}

.ft{color:var(--mu);font-size:12px;margin:14px 0}
</style>

 h+=blk(t,'thri',`<details class="card"><summary>🧠 Пороги охоты (рассудок команды)</summary><p class="ex">У каждого призрака есть число — <b>порог рассудка</b>. Призрак может начать охоту, только когда <b>средний рассудок команды ниже этого числа</b>. У большинства порог 50%.</p>`+

 `<div style="margin:8px 0"><b>Ровно 50% (все остальные)</b><br>${G.filter(g=>g.maxT==50&&g.thr=='50%').map(g=>chip(g,rem)).join('')}</div>`+

 ${MECH[g.id]?`<section><h4>Как работает</h4>${ul(MECH[g.id],'')}</section>`:''}
